# Builds the demo app (Create React App) and deploys it to GitHub Pages.
# The build runs with no REACT_APP_UW_TOKEN, so the published site always
# uses the bundled ticker-data simulator (src/demo/data_feed/simulatorFeed.js)
# — no API access, no secrets in the bundle.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # CRA treats lint warnings as errors when CI=true; don't fail the
          # deploy on warnings
          CI: "false"
      # Pages must be enabled once by hand (Settings → Pages → Source:
      # "GitHub Actions") — the workflow token can't create the Pages site
      # itself, that API call needs repo admin permissions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
